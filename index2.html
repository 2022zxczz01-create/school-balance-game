<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>슬기로운 교직생활 밸런스 게임 (실시간)</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }

        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .slide-up { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .bounce-in { animation: bounceIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }

        .option-btn { transition: all 0.2s ease; }
        .option-btn:active { transform: scale(0.96); }
        .option-btn.selected { 
            border-color: #4f46e5 !important; 
            background-color: #e0e7ff !important;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.2);
        }

        /* 커스텀 스크롤바 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, collection, deleteDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
    apiKey: "AIzaSyAvtf6jwncCxXLJrnN8tCZCSRdYwRoRMLE",
    authDomain: "school-balance-83574.firebaseapp.com",
    projectId: "school-balance-83574",
    storageBucket: "school-balance-83574.firebasestorage.app",
    messagingSenderId: "453228311111",
    appId: "1:453228311111:web:503bcaddabe6a1b049f762"
  };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // React 코드에서 사용할 수 있도록 전역에 노출
        window.fbAPI = {
            auth, db, signInAnonymously, signInWithCustomToken,
            doc, setDoc, getDoc, updateDoc, onSnapshot, collection, deleteDoc, getDocs
        };
        window.dispatchEvent(new Event('firebase-ready'));
    </script>
</head>
<body class="text-gray-800 bg-gradient-to-br from-indigo-50 to-blue-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const questions = [
            { id: 1, title: "더 듣고 싶은 기분 좋은 칭찬은?", optA: "학생들의 \"선생님, 오늘 완전 예뻐요/멋져요!\"", optB: "학생들의 \"선생님, 오늘 수업 진짜 재밌었어요!\"" },
            { id: 2, title: "동료 교사에게 더 감동받는 순간은?", optA: "지친 오후, 말없이 건네주는 시원한 커피 한 잔", optB: "내 노력을 알아주는 진심 어린 칭찬 쪽지 한 장" },
            { id: 3, title: "교무실 간식 창고에 절대 떨어지면 안 되는 것은?", optA: "달달함 한도 초과! 당 충전용 초콜릿과 젤리", optB: "교사의 생명수! 잠을 깨워줄 캡슐 커피와 믹스 커피" },
            { id: 4, title: "꿀 같은 공강 시간, 더 하고 싶은 것은?", optA: "아무도 없는 곳에서 조용히 혼자만의 꿀잠 타임 가지기", optB: "마음 맞는 동료 교사와 시간 가는 줄 모르고 폭풍 수다 떨기" },
            { id: 5, title: "전체 교직원 워크숍(연수), 더 선호하는 일정은?", optA: "경치 좋은 곳에서 자유시간을 가지며 조용히 힐링하기", optB: "다 같이 레크리에이션하며 신나게 웃고 떠들며 친해지기" },
            { id: 6, title: "더 끔찍한 업무 마비 상황은?", optA: "성적 마감일, 나이스(NEIS) 서버 하루 종일 먹통", optB: "시험 출제일, 교무실 복사기와 프린터 모두 고장" },
            { id: 7, title: "학급 행사, 담임으로서 더 뿌듯한 순간은?", optA: "체육대회에서 우리 반이 압도적인 실력으로 종합 우승하기", optB: "장기자랑에서 꼴찌해도 아이들이 하나 되어 눈물 흘리며 기뻐하기" },
            { id: 8, title: "퇴근 후 동료들과의 번개 모임! 더 끌리는 코스는?", optA: "맛있는 저녁 식사하며 그동안 쌓인 스트레스 맛집 탐방으로 풀기", optB: "가볍게 커피 한잔하며 서로의 소소한 일상과 고민 나누기" },
            { id: 9, title: "새 학기 첫날, 더 긴장되는 순간은?", optA: "우리 반 아이들과 처음 만나 첫 인사 나누는 조례 시간", optB: "새로 오신 동료 선생님들과 처음 인사 나누는 교직원 회의 시간" },
            { id: 10, title: "교직 생활 중 나에게 더 큰 에너지가 되는 것은?", optA: "졸업한 제자가 잊지 않고 찾아와 건네는 감사 인사", optB: "힘들 때 언제든 내 편이 되어주는 든든한 동료 교사들의 응원" }
        ];

        function App() {
            // 시스템 상태
            const [isReady, setIsReady] = React.useState(false);
            const [appId, setAppId] = React.useState('school-balance-v2');
            const [userId, setUserId] = React.useState(null);
            
            // 앱 UI 모드: 'home', 'host', 'player'
            const [mode, setMode] = React.useState('home'); 
            
            // 실시간 게임 상태 (Firebase 연동)
            const [gameState, setGameState] = React.useState({
                status: 'lobby', // 'lobby', 'question', 'result', 'end'
                currentQ: 0,
                majorities: {} // { 0: 'A', 1: 'Tie', ... }
            });
            const [players, setPlayers] = React.useState([]); // 전체 플레이어 데이터
            
            // 로컬 유저 폼 상태
            const [userName, setUserName] = React.useState('');
            
            // Toast 메시지
            const [toastMsg, setToastMsg] = React.useState('');

            // 초기화 확인 모달 상태
            const [showConfirmModal, setShowConfirmModal] = React.useState(false);
            
            // QR 코드 접속 주소 상태
            const [shareUrl, setShareUrl] = React.useState(window.location.href);

            React.useEffect(() => {
                const initFirebase = async () => {
                    if (!window.fbAPI) return;
                    
                    const envAppId = typeof __app_id !== 'undefined' ? __app_id : 'demo-school-balance';
                    setAppId(envAppId);

                    try {
                        const token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
                        if (token) {
                            await window.fbAPI.signInWithCustomToken(window.fbAPI.auth, token);
                        } else {
                            await window.fbAPI.signInAnonymously(window.fbAPI.auth);
                        }
                        
                        const uid = window.fbAPI.auth.currentUser.uid;
                        setUserId(uid);
                        
                        // 실시간 데이터 리스너 설정
                        setupListeners(envAppId);
                        setIsReady(true);
                    } catch (error) {
                        console.error("Auth error:", error);
                        showToast("서버 연결에 실패했습니다.");
                    }
                };

                if (window.fbAPI) {
                    initFirebase();
                } else {
                    window.addEventListener('firebase-ready', initFirebase);
                    return () => window.removeEventListener('firebase-ready', initFirebase);
                }
            }, []);

            const setupListeners = (currentAppId) => {
                const { db, doc, onSnapshot, collection } = window.fbAPI;
                
                // GameState 리스너
                const gameRef = doc(db, 'artifacts', currentAppId, 'public', 'data', 'gameState', 'main');
                onSnapshot(gameRef, (snap) => {
                    if (snap.exists()) {
                        setGameState(snap.data());
                    } else {
                        // 최초 생성
                        window.fbAPI.setDoc(gameRef, {
                            status: 'lobby',
                            currentQ: 0,
                            majorities: {}
                        });
                    }
                }, (error) => console.error("Game sync error", error));

                // Players 리스너
                const playersRef = collection(db, 'artifacts', currentAppId, 'public', 'data', 'players');
                onSnapshot(playersRef, (snap) => {
                    const playersData = [];
                    snap.forEach(doc => {
                        playersData.push({ id: doc.id, ...doc.data() });
                    });
                    setPlayers(playersData);
                }, (error) => console.error("Players sync error", error));
            };

            const showToast = (msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(''), 2500);
            };

            // --- 호스트(진행자) 기능 ---
            const resetGame = () => {
                setShowConfirmModal(true);
            };

            const executeReset = async () => {
                const { db, doc, setDoc, collection, getDocs, deleteDoc } = window.fbAPI;
                
                // 게임 상태 리셋
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'gameState', 'main'), {
                    status: 'lobby',
                    currentQ: 0,
                    majorities: {}
                });

                // 기존 플레이어 데이터 삭제
                const playersRef = collection(db, 'artifacts', appId, 'public', 'data', 'players');
                const snapshot = await getDocs(playersRef);
                snapshot.forEach(async (d) => {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'players', d.id));
                });
                
                setShowConfirmModal(false);
                showToast("게임이 초기화되었습니다.");
            };

            const startNextQuestion = async () => {
                const { db, doc, updateDoc } = window.fbAPI;
                const nextQ = gameState.status === 'lobby' ? 0 : gameState.currentQ + 1;
                
                if (nextQ >= questions.length) {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'gameState', 'main'), {
                        status: 'end'
                    });
                } else {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'gameState', 'main'), {
                        status: 'question',
                        currentQ: nextQ
                    });
                }
            };

            const revealResult = async () => {
                const { db, doc, updateDoc } = window.fbAPI;
                const qIdx = gameState.currentQ;
                
                // 정답(과반수) 계산
                let countA = 0;
                let countB = 0;
                players.forEach(p => {
                    if (p.answers && p.answers[qIdx] === 'A') countA++;
                    if (p.answers && p.answers[qIdx] === 'B') countB++;
                });

                let majority = 'Tie';
                if (countA > countB) majority = 'A';
                if (countB > countA) majority = 'B';

                const newMajorities = { ...gameState.majorities, [qIdx]: majority };

                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'gameState', 'main'), {
                    status: 'result',
                    majorities: newMajorities
                });
            };

            // --- 플레이어(참여자) 기능 ---
            const joinGame = async (e) => {
                e.preventDefault();
                if (userName.trim().length < 2) {
                    showToast('성함(또는 닉네임)을 2자 이상 입력해주세요.');
                    return;
                }
                const { db, doc, setDoc } = window.fbAPI;
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'players', userId), {
                    name: userName,
                    answers: {},
                    timestamp: Date.now()
                });
                setMode('player');
            };

            const submitAnswer = async (choice) => {
                const { db, doc, getDoc, updateDoc } = window.fbAPI;
                const playerRef = doc(db, 'artifacts', appId, 'public', 'data', 'players', userId);
                
                const snap = await getDoc(playerRef);
                if (snap.exists()) {
                    const data = snap.data();
                    const newAnswers = { ...data.answers, [gameState.currentQ]: choice };
                    await updateDoc(playerRef, { answers: newAnswers });
                }
            };

            // 점수 계산 유틸 (로컬에서 계산)
            const calculatePlayerScore = (playerAnswers) => {
                if (!playerAnswers) return 0;
                let score = 0;
                Object.keys(gameState.majorities).forEach(qIdx => {
                    const majority = gameState.majorities[qIdx];
                    if (majority !== 'Tie' && playerAnswers[qIdx] === majority) {
                        score++;
                    }
                });
                return score;
            };

            const renderHome = () => {
                if (!isReady) return <div className="min-h-screen flex items-center justify-center font-bold text-indigo-600">서버 접속 중...</div>;

                return (
                    <div className="flex flex-col items-center justify-center min-h-screen p-4 fade-in">
                        <div className="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden">
                            <div className="bg-indigo-600 p-8 text-center text-white relative">
                                <span className="absolute top-4 right-4 bg-indigo-800 text-xs px-2 py-1 rounded-md">LIVE</span>
                                <h2 className="text-sm font-semibold opacity-90 mb-2">과반수의 선택을 맞혀라! 👀</h2>
                                <h1 className="text-3xl font-black leading-tight tracking-tight">슬기로운<br/>교직생활<br/>밸런스 게임</h1>
                            </div>
                            
                            <div className="p-8">
                                <form onSubmit={joinGame} className="space-y-6">
                                    <div>
                                        <label className="block text-sm font-bold text-gray-700 mb-2">참가자 성함 (닉네임)</label>
                                        <input 
                                            type="text" 
                                            value={userName}
                                            onChange={(e) => setUserName(e.target.value)}
                                            placeholder="예: 6학년 1반 홍길동" 
                                            className="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all font-medium"
                                        />
                                    </div>
                                    <button 
                                        type="submit" 
                                        className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow-lg transition-all text-lg"
                                    >
                                        게임 참가하기
                                    </button>
                                </form>

                                <div className="mt-8 text-center pt-6 border-t border-gray-100">
                                    <button 
                                        onClick={() => setMode('host')} 
                                        className="text-sm text-gray-400 hover:text-indigo-600 font-semibold transition-colors flex items-center justify-center gap-1 mx-auto"
                                    >
                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                        진행자 모드로 열기
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            const renderHostView = () => {
                const q = questions[gameState.currentQ];
                const answeredCount = players.filter(p => p.answers && p.answers[gameState.currentQ]).length;
                const totalPlayers = players.length;
                const currentUrl = encodeURIComponent(shareUrl);
                const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${currentUrl}&color=3730a3`;

                return (
                    <div className="flex flex-col min-h-screen max-w-2xl mx-auto p-4 fade-in">
                        <div className="flex justify-between items-center mb-6 pt-2 border-b border-indigo-200 pb-4">
                            <h1 className="text-xl font-black text-indigo-900 flex items-center gap-2">
                                👑 진행자 대시보드
                            </h1>
                            <div className="flex gap-2">
                                <button onClick={() => setMode('home')} className="text-xs bg-gray-200 text-gray-700 px-3 py-1.5 rounded font-bold hover:bg-gray-300 transition-colors">홈으로</button>
                                <button onClick={resetGame} className="text-xs bg-red-100 text-red-600 px-3 py-1.5 rounded font-bold hover:bg-red-200 transition-colors">초기화</button>
                            </div>
                        </div>

                        {gameState.status === 'lobby' && (
                            <div className="bg-white rounded-2xl p-8 text-center shadow-md">
                                <h2 className="text-2xl font-bold mb-4 text-gray-800">선생님들을 초대해주세요!</h2>
                                
                                <div className="mb-6 flex flex-col items-center">
                                    <img src={qrUrl} alt="QR Code" className="w-32 h-32 rounded-lg shadow-sm border border-gray-100 mb-4" />
                                    <div className="w-full max-w-sm text-left">
                                        <label className="block text-xs font-bold text-gray-500 mb-1">접속 주소 (QR코드 연동)</label>
                                        <input 
                                            type="text" 
                                            value={shareUrl}
                                            onChange={(e) => setShareUrl(e.target.value)}
                                            className="w-full px-3 py-2 text-sm border-2 border-gray-200 rounded-lg focus:outline-none focus:border-indigo-500 transition-colors"
                                            placeholder="공유할 웹 페이지 주소"
                                        />
                                        <p className="text-xs text-gray-400 mt-1 break-keep">
                                            * 현재 샌드박스(미리보기) 환경의 임시 주소입니다. 스마트폰 접속이 안 될 경우, 외부에 배포된 실제 주소(예: Vercel, Netlify 등)를 이곳에 붙여넣으세요.
                                        </p>
                                    </div>
                                </div>

                                <div className="text-lg font-bold text-gray-600 mb-8">
                                    현재 참가자: <span className="text-3xl text-indigo-600 mx-2">{totalPlayers}</span>명
                                </div>
                                <button onClick={startNextQuestion} className="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl text-xl shadow-lg hover:bg-indigo-700">
                                    첫 번째 질문 시작하기
                                </button>
                            </div>
                        )}

                        {gameState.status === 'question' && (
                            <div className="bg-white rounded-2xl p-8 text-center shadow-md flex flex-col items-center">
                                <span className="bg-indigo-100 text-indigo-800 font-bold px-3 py-1 rounded-full text-sm mb-4">질문 {gameState.currentQ + 1} / {questions.length}</span>
                                <h2 className="text-2xl font-black mb-8 break-keep leading-relaxed">{q.title}</h2>
                                
                                <div className="w-full flex gap-4 mb-8">
                                    <div className="flex-1 bg-blue-50 border border-blue-200 p-4 rounded-xl text-sm font-bold text-blue-900 flex items-center justify-center break-keep">
                                        <span className="text-blue-400 mr-2">A.</span>{q.optA}
                                    </div>
                                    <div className="flex-1 bg-rose-50 border border-rose-200 p-4 rounded-xl text-sm font-bold text-rose-900 flex items-center justify-center break-keep">
                                        <span className="text-rose-400 mr-2">B.</span>{q.optB}
                                    </div>
                                </div>

                                <div className="w-full bg-gray-100 rounded-full h-4 mb-4 overflow-hidden relative">
                                    <div className="bg-indigo-500 h-full transition-all duration-300" style={{width: `${totalPlayers ? (answeredCount/totalPlayers)*100 : 0}%`}}></div>
                                </div>
                                <div className="text-gray-600 font-bold mb-8">
                                    응답 현황: <span className="text-indigo-600 text-xl">{answeredCount}</span> / {totalPlayers} 명
                                </div>

                                <button onClick={revealResult} className="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl text-xl shadow-lg hover:bg-indigo-700">
                                    결과 공개하기
                                </button>
                            </div>
                        )}

                        {gameState.status === 'result' && (
                            <div className="bg-white rounded-2xl p-8 shadow-md">
                                <div className="text-center mb-6">
                                    <span className="bg-indigo-100 text-indigo-800 font-bold px-3 py-1 rounded-full text-sm mb-4 inline-block">질문 {gameState.currentQ + 1} 결과</span>
                                    <h2 className="text-xl font-black break-keep">{q.title}</h2>
                                </div>
                                
                                {(() => {
                                    const countA = players.filter(p => p.answers && p.answers[gameState.currentQ] === 'A').length;
                                    const countB = players.filter(p => p.answers && p.answers[gameState.currentQ] === 'B').length;
                                    const total = countA + countB;
                                    const pA = total ? Math.round((countA/total)*100) : 0;
                                    const pB = total ? Math.round((countB/total)*100) : 0;
                                    const majority = gameState.majorities[gameState.currentQ];

                                    return (
                                        <div className="mb-8">
                                            <div className="flex h-12 w-full rounded-xl overflow-hidden font-bold text-white shadow-inner relative mb-3">
                                                {pA > 0 && <div className={`flex items-center px-4 transition-all duration-700 ${majority==='A' ? 'bg-blue-600':'bg-blue-300'}`} style={{width:`${pA}%`}}>{pA}%</div>}
                                                {pB > 0 && <div className={`flex items-center justify-end px-4 transition-all duration-700 ${majority==='B' ? 'bg-rose-600':'bg-rose-300'}`} style={{width:`${pB}%`}}>{pB}%</div>}
                                                <div className="absolute left-1/2 top-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-white text-gray-800 px-3 py-1 rounded-lg shadow-md text-xs">VS</div>
                                            </div>
                                            <div className="flex justify-between text-sm font-bold">
                                                <div className={`w-1/2 pr-2 break-keep ${majority==='A'?'text-blue-700':'text-gray-400'}`}>A. {q.optA} ({countA}명) {majority==='A'&&'👑'}</div>
                                                <div className={`w-1/2 pl-2 text-right break-keep ${majority==='B'?'text-rose-700':'text-gray-400'}`}>{majority==='B'&&'👑'} B. {q.optB} ({countB}명)</div>
                                            </div>
                                        </div>
                                    )
                                })()}

                                <button onClick={startNextQuestion} className="w-full bg-gray-800 text-white font-bold py-4 rounded-xl text-lg shadow-lg hover:bg-gray-900">
                                    {gameState.currentQ === questions.length - 1 ? '최종 랭킹 보기' : '다음 질문으로'}
                                </button>
                            </div>
                        )}

                        {gameState.status === 'end' && (
                            <div className="bg-white rounded-2xl p-8 shadow-md">
                                <h2 className="text-2xl font-black text-center mb-8">🏆 최종 눈치왕 랭킹</h2>
                                {(() => {
                                    const rankedPlayers = [...players].map(p => ({
                                        ...p,
                                        score: calculatePlayerScore(p.answers)
                                    })).sort((a,b) => b.score - a.score);

                                    return (
                                        <div className="space-y-3">
                                            {rankedPlayers.slice(0, 10).map((p, idx) => (
                                                <div key={p.id} className={`flex items-center justify-between p-4 rounded-xl border ${idx===0?'bg-yellow-50 border-yellow-200': idx===1?'bg-gray-50 border-gray-200' : idx===2?'bg-orange-50 border-orange-100' : 'bg-white border-gray-100'}`}>
                                                    <div className="flex items-center gap-4">
                                                        <div className={`w-8 h-8 rounded-full flex items-center justify-center font-black text-sm ${idx===0?'bg-yellow-400 text-white shadow-md' : idx===1?'bg-gray-300 text-white shadow-sm' : idx===2?'bg-orange-300 text-white shadow-sm' : 'bg-gray-100 text-gray-500'}`}>
                                                            {idx + 1}
                                                        </div>
                                                        <span className="font-bold text-gray-800 text-lg">{p.name}</span>
                                                    </div>
                                                    <div className="font-black text-xl text-indigo-600">
                                                        {p.score}<span className="text-sm text-gray-400 font-medium ml-1">점</span>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )
                                })()}
                                <button onClick={resetGame} className="w-full mt-8 bg-gray-100 text-gray-700 font-bold py-4 rounded-xl hover:bg-gray-200">새로운 게임 시작</button>
                            </div>
                        )}
                    </div>
                );
            };

            const renderPlayerView = () => {
                const me = players.find(p => p.id === userId);
                const myScore = me ? calculatePlayerScore(me.answers) : 0;
                
                // 순위 계산
                const rankedPlayers = [...players].map(p => ({
                    id: p.id,
                    score: calculatePlayerScore(p.answers)
                })).sort((a,b) => b.score - a.score);
                const myRank = rankedPlayers.findIndex(p => p.id === userId) + 1;

                return (
                    <div className="flex flex-col min-h-screen max-w-md mx-auto bg-white shadow-xl relative">
                        {/* 상단 헤더 (내 정보) */}
                        <div className="bg-indigo-600 text-white px-5 py-4 flex justify-between items-center shadow-md z-10">
                            <div className="font-bold">{me?.name} 선생님</div>
                            <div className="flex gap-3 text-sm font-semibold">
                                <span className="bg-indigo-800 px-2 py-1 rounded-md">⭐ {myScore}점</span>
                                <span className="bg-indigo-800 px-2 py-1 rounded-md">🏆 {myRank}위</span>
                            </div>
                        </div>

                        <div className="flex-1 flex flex-col p-6 bg-gray-50 overflow-y-auto">
                            {gameState.status === 'lobby' && (
                                <div className="flex-1 flex flex-col items-center justify-center text-center fade-in">
                                    <div className="w-16 h-16 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin mb-6"></div>
                                    <h2 className="text-xl font-bold text-gray-800 mb-2">대기실 입장 완료!</h2>
                                    <p className="text-gray-500 font-medium">진행자가 게임을 시작할 때까지<br/>잠시만 기다려주세요.</p>
                                </div>
                            )}

                            {gameState.status === 'question' && (() => {
                                const q = questions[gameState.currentQ];
                                const myAnswer = me?.answers?.[gameState.currentQ];
                                
                                if (myAnswer) {
                                    return (
                                        <div className="flex-1 flex flex-col items-center justify-center text-center fade-in">
                                            <div className="w-16 h-16 bg-green-100 text-green-500 rounded-full flex items-center justify-center mb-6">
                                                <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"></path></svg>
                                            </div>
                                            <h2 className="text-xl font-bold text-gray-800 mb-2">선택 완료!</h2>
                                            <p className="text-gray-500 font-medium">다른 선생님들의 응답을 기다리고 있습니다.<br/>진행자의 화면을 주목해주세요.</p>
                                        </div>
                                    )
                                }

                                return (
                                    <div className="flex flex-col h-full fade-in">
                                        <div className="text-center mb-8 mt-4">
                                            <span className="text-sm font-bold text-indigo-600">질문 {gameState.currentQ + 1}</span>
                                            <h2 className="text-2xl font-black text-gray-800 mt-2 break-keep leading-snug">{q.title}</h2>
                                        </div>

                                        <div className="flex flex-col gap-4 mt-auto mb-4">
                                            <button onClick={() => submitAnswer('A')} className="option-btn relative bg-white border-2 border-blue-200 hover:border-blue-500 text-blue-900 font-bold p-6 rounded-2xl shadow-sm text-lg break-keep text-center h-36 flex items-center justify-center">
                                                <div className="absolute top-2 left-3 text-blue-300 font-black text-xl">A</div>
                                                {q.optA}
                                            </button>
                                            <div className="flex justify-center -my-3 z-10 relative pointer-events-none">
                                                <span className="bg-indigo-600 text-white font-black text-sm px-4 py-1 rounded-full shadow-md">VS</span>
                                            </div>
                                            <button onClick={() => submitAnswer('B')} className="option-btn relative bg-white border-2 border-rose-200 hover:border-rose-500 text-rose-900 font-bold p-6 rounded-2xl shadow-sm text-lg break-keep text-center h-36 flex items-center justify-center">
                                                <div className="absolute top-2 left-3 text-rose-300 font-black text-xl">B</div>
                                                {q.optB}
                                            </button>
                                        </div>
                                    </div>
                                )
                            })()}

                            {gameState.status === 'result' && (() => {
                                const q = questions[gameState.currentQ];
                                const myAnswer = me?.answers?.[gameState.currentQ];
                                const majority = gameState.majorities[gameState.currentQ];
                                const isCorrect = majority !== 'Tie' && myAnswer === majority;
                                const countA = players.filter(p => p.answers && p.answers[gameState.currentQ] === 'A').length;
                                const countB = players.filter(p => p.answers && p.answers[gameState.currentQ] === 'B').length;

                                return (
                                    <div className="flex-1 flex flex-col items-center justify-center fade-in text-center w-full">
                                        {isCorrect ? (
                                            <div className="bounce-in">
                                                <div className="text-4xl mb-2">🎉</div>
                                                <h2 className="text-2xl font-black text-indigo-600 mb-1">성공! 눈치 적중</h2>
                                                <p className="text-sm font-bold text-gray-500 mb-6">+1점을 획득했습니다.</p>
                                            </div>
                                        ) : (
                                            <div className="bounce-in">
                                                <div className="text-4xl mb-2">😅</div>
                                                <h2 className="text-2xl font-black text-rose-500 mb-1">앗! 마이너 취향</h2>
                                                <p className="text-sm font-bold text-gray-500 mb-6">점수 획득에 실패했습니다.</p>
                                            </div>
                                        )}
                                        
                                        <div className="w-full bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                                            <div className="mb-4">
                                                <span className="text-xs font-bold text-gray-400">나의 선택</span>
                                                <div className={`font-bold mt-1 ${myAnswer==='A'?'text-blue-600':'text-rose-600'}`}>
                                                    {myAnswer === 'A' ? `A. ${q.optA}` : myAnswer === 'B' ? `B. ${q.optB}` : '응답 안함'}
                                                </div>
                                            </div>
                                            <hr className="my-3 border-gray-100"/>
                                            <div>
                                                <span className="text-xs font-bold text-gray-400">대중의 선택 (과반수)</span>
                                                <div className={`font-bold mt-1 flex items-center justify-center gap-2 ${majority==='A'?'text-blue-600':majority==='B'?'text-rose-600':'text-gray-600'}`}>
                                                    {majority === 'A' ? `👑 A. ${q.optA}` : majority === 'B' ? `👑 B. ${q.optB}` : '무승부 (동률)'}
                                                </div>
                                                <div className="text-xs text-gray-400 mt-2">A: {countA}명 / B: {countB}명</div>
                                            </div>
                                        </div>
                                        
                                        <p className="mt-8 text-sm text-gray-400 animate-pulse">다음 질문을 기다리는 중...</p>
                                    </div>
                                )
                            })()}

                            {gameState.status === 'end' && (
                                <div className="flex-1 flex flex-col items-center justify-center fade-in text-center">
                                    <div className="text-6xl mb-4">🏆</div>
                                    <h2 className="text-2xl font-black text-gray-800 mb-2">게임 종료!</h2>
                                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 w-full mb-6">
                                        <div className="text-sm text-gray-500 font-bold mb-1">나의 최종 기록</div>
                                        <div className="text-4xl font-black text-indigo-600 mb-2">{myScore}<span className="text-xl text-gray-400">점</span></div>
                                        <div className="text-lg font-bold text-gray-700">전체 <span className="text-indigo-600">{myRank}</span>위</div>
                                    </div>
                                    <p className="text-gray-500 font-medium break-keep">수고하셨습니다!<br/>진행자 화면에서 전체 랭킹을 확인하세요.</p>
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            return (
                <div className="relative">
                    {mode === 'home' && renderHome()}
                    {mode === 'host' && renderHostView()}
                    {mode === 'player' && renderPlayerView()}

                    {/* Toast Message UI */}
                    {toastMsg && (
                        <div className="fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-2xl font-semibold text-sm z-50 fade-in pointer-events-none">
                            {toastMsg}
                        </div>
                    )}

                    {/* 초기화 확인 커스텀 모달 */}
                    {showConfirmModal && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4 fade-in">
                            <div className="bg-white rounded-2xl p-6 w-full max-w-sm text-center shadow-2xl slide-up">
                                <h3 className="text-xl font-bold mb-2 text-gray-800">게임 초기화</h3>
                                <p className="text-gray-600 mb-6 break-keep text-sm">진행 중인 게임을 리셋하시겠습니까?<br/>모든 참여자의 데이터가 삭제됩니다.</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setShowConfirmModal(false)} className="flex-1 py-3 bg-gray-100 text-gray-700 font-bold rounded-xl hover:bg-gray-200 transition-colors">취소</button>
                                    <button onClick={executeReset} className="flex-1 py-3 bg-rose-500 text-white font-bold rounded-xl hover:bg-rose-600 transition-colors">초기화</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
